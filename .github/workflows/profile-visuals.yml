name: Generate profile visuals

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build neon stats card
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT, read:user + repo) to include private contributions
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/stats_card.py "${{ github.repository_owner }}" dist/stats.svg

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff2bd6&color_dots=#160536,#3c1361,#7b2ff7,#b14aed,#00f0ff&color_background=#0b0221
            dist/snake-light.svg?color_snake=#7b2ff7&color_dots=#ebedf0,#e0c3fc,#b14aed,#7b2ff7,#ff2bd6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
