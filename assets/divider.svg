<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12">
  <defs>
    <linearGradient id="g" x1="0" x2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ff2bd6"/>
      <stop offset=".5" stop-color="#7b2ff7"/>
      <stop offset=".8" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#g)" filter="url(#b)"/>
  <rect x="0" y="5.5" width="1000" height="1" fill="url(#g)"/>
  <rect x="-120" y="4" width="120" height="4" rx="2" fill="url(#spark)">
    <animate attributeName="x" from="-120" to="1000" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
